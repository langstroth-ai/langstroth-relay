apiVersion: v2
name: ligus-relay
description: Content-blind, end-to-end-encrypted sync relay for Ligus, with the tunnel split onto its own single-replica Deployment.
type: application
version: 0.3.0
appVersion: "0.3.0"
home: https://github.com/ligus-ai/relay
sources:
  - https://github.com/ligus-ai/relay
keywords:
  - ligus
  - relay
  - e2ee
kubeVersion: ">=1.27.0-0"
# Shared Postgres templates (database.mode). charts/ligus-postgres is a
# symlink to ../ligus-postgres in this repository, so no
# `helm dependency build` is needed.
dependencies:
  - name: ligus-postgres
    version: 0.1.0
    repository: file://../ligus-postgres
