{{- if .Values.httpRoute.enabled }}
{{- $fullname := include "ligus-relay.fullname" . -}}
{{- $syncSvc := ternary $fullname (printf "%s-sync" $fullname) (eq (include "ligus-relay.topology" .) "single") -}}
{{- $tunnelSvc := ternary $fullname (printf "%s-tunnel" $fullname) (eq (include "ligus-relay.topology" .) "single") -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "ligus-relay.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- if ne .Values.tunnel.mode "off" }}
    - matches:
        - path: { type: PathPrefix, value: /v1/tunnel }
      backendRefs:
        - name: {{ $tunnelSvc }}
          port: {{ .Values.service.port }}
      {{- with .Values.httpRoute.timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: {{ $syncSvc }}
          port: {{ .Values.service.port }}
      {{- with .Values.httpRoute.timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
