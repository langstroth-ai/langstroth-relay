{{- if .Values.ingress.enabled }}
{{- $fullname := include "ligus-relay.fullname" . -}}
{{- $syncSvc := ternary $fullname (printf "%s-sync" $fullname) (eq (include "ligus-relay.topology" .) "single") -}}
{{- $tunnelSvc := ternary $fullname (printf "%s-tunnel" $fullname) (eq (include "ligus-relay.topology" .) "single") -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "ligus-relay.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.secretName }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- if ne .Values.tunnel.mode "off" }}
          - path: /v1/tunnel
            pathType: Prefix
            backend:
              service:
                name: {{ $tunnelSvc }}
                port:
                  name: http
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $syncSvc }}
                port:
                  name: http
{{- end }}
