{{- if and .Values.externalDatabase.url (not .Values.externalDatabase.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ligus-relay.databaseSecretName" . }}
  labels:
    {{- include "ligus-relay.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.externalDatabase.url | quote }}
{{- end }}
