{{- if and (include "ligus-relay.hasDatabase" .) (not .Values.externalDatabase.existingSecret) }}
{{- $url := .Values.externalDatabase.url -}}
{{- if .Values.postgres.enabled -}}
{{- $pw := include "ligus-relay.postgresPassword" . -}}
{{- $url = printf "postgres://%s:%s@%s:5432/%s?sslmode=disable" .Values.postgres.username $pw (include "ligus-relay.postgresName" .) .Values.postgres.database -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ligus-relay.databaseSecretName" . }}
  labels:
    {{- include "ligus-relay.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ $url | quote }}
{{- end }}
