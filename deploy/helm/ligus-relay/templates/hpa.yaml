{{- if and (eq (include "ligus-relay.topology" .) "split") .Values.sync.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ligus-relay.fullname" . }}-sync
  labels:
    {{- include "ligus-relay.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "ligus-relay.fullname" . }}-sync
  minReplicas: {{ .Values.sync.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.sync.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.sync.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
