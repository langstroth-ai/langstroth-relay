{{- $fullname := include "ligus-relay.fullname" . -}}
{{- $ctx := include "ligus-relay.dbCtx" . | fromYaml -}}
{{- $_ := set $ctx "root" . -}}
{{- /* Zero while a bundled-Postgres restore runs, so nothing writes during it. */ -}}
{{- $replicas := ternary 0 1 (eq (include "ligus-postgres.restoring" $ctx) "true") -}}
{{- if eq (include "ligus-relay.topology" .) "single" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "ligus-relay.labels" . | nindent 4 }}
    app.kubernetes.io/component: relay
spec:
  # Exactly one: the tunnel's control connections and (without a database)
  # the store itself are in process.
  replicas: {{ $replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ligus-relay.selectorLabels" (dict "root" . "component" "relay") | nindent 6 }}
  template:
    {{- include "ligus-relay.podTemplate" (dict "root" . "component" "relay" "tunnelMode" .Values.tunnel.mode "resources" .Values.singlePod.resources "withApns" true) | nindent 4 }}
{{- else }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-sync
  labels:
    {{- include "ligus-relay.labels" . | nindent 4 }}
    app.kubernetes.io/component: sync
spec:
  # One replica, and Recreate: a rolling update would briefly run two
  # pairing-code and rate-limit stores.
  replicas: {{ $replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ligus-relay.selectorLabels" (dict "root" . "component" "sync") | nindent 6 }}
  template:
    {{- include "ligus-relay.podTemplate" (dict "root" . "component" "sync" "tunnelMode" "off" "resources" .Values.sync.resources "withApns" false) | nindent 4 }}
{{- if ne .Values.tunnel.mode "off" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-tunnel
  labels:
    {{- include "ligus-relay.labels" . | nindent 4 }}
    app.kubernetes.io/component: tunnel
spec:
  # Exactly one replica, and Recreate: live host control sockets are in
  # process, so a rolling update would split hosts and phones across pods.
  replicas: {{ $replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ligus-relay.selectorLabels" (dict "root" . "component" "tunnel") | nindent 6 }}
  template:
    {{- include "ligus-relay.podTemplate" (dict "root" . "component" "tunnel" "tunnelMode" .Values.tunnel.mode "resources" .Values.tunnelPod.resources "withApns" true) | nindent 4 }}
{{- end }}
{{- end }}
