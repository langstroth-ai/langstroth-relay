{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ligus-relay.serviceAccountName" . }}
  labels:
    {{- include "ligus-relay.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The relay needs no Kubernetes API access.
automountServiceAccountToken: false
{{- end }}
