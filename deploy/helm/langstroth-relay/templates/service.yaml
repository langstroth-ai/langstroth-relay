{{- $fullname := include "langstroth-relay.fullname" . -}}
{{- $components := list -}}
{{- if eq (include "langstroth-relay.topology" .) "single" -}}
{{- $components = list (list $fullname "relay") -}}
{{- else -}}
{{- $components = list (list (printf "%s-sync" $fullname) "sync") -}}
{{- if ne .Values.tunnel.mode "off" -}}
{{- $components = append $components (list (printf "%s-tunnel" $fullname) "tunnel") -}}
{{- end -}}
{{- end -}}
{{- range $i, $c := $components }}
{{- if $i }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ index $c 0 }}
  labels:
    {{- include "langstroth-relay.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ index $c 1 }}
spec:
  type: {{ $.Values.service.type }}
  ports:
    - name: http
      port: {{ $.Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "langstroth-relay.selectorLabels" (dict "root" $ "component" (index $c 1)) | nindent 4 }}
{{- end }}
