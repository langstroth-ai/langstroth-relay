{{- /* Deprecated externalDatabase.url: rendered into a Secret. */ -}}
{{- if and (not (dig "mode" "" (default (dict) .Values.database))) .Values.externalDatabase.url (not .Values.externalDatabase.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "langstroth-relay.fullname" . }}-db
  labels:
    {{- include "langstroth-relay.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.externalDatabase.url | quote }}
{{- end }}
