config:
  public_url: https://auth.example.com
  trusted_proxies: ["10.244.0.15/32"]
  tenants:
    - id: home
      oidc:
        issuer: https://dex.example.com
        client_id: ligus-auth
        client_secret_file: /etc/ligus-auth/secrets/dex-client-secret
      idp_groups: true
      workspaces: ["7f0c2a5e-3d4b-4b8e-9a51-2a6f3c1d9e01"]
      grants:
        ligus-users: ["7f0c2a5e-3d4b-4b8e-9a51-2a6f3c1d9e01"]
signingKey:
  existingSecret: ligus-auth-signing-key
secretFiles:
  existingSecret: ligus-auth-secrets
adminToken:
  existingSecret: ligus-auth-admin
persistence:
  enabled: true
ingress:
  enabled: true
  className: nginx
  host: auth.example.com
  tls:
    secretName: auth-example-tls
