{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ligus-auth.fullname" . }}
  labels: {{- include "ligus-auth.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "ligus-auth.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if $np.restrictEgress }}
    - Egress
    {{- end }}
  ingress:
    # Sign-in, token and SCIM routes: from ingressFrom (empty = anywhere;
    # usually your ingress controller).
    - ports:
        - {port: http, protocol: TCP}
      {{- with $np.ingressFrom }}
      from: {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if and .Values.adminToken.existingSecret $np.adminIngressFrom }}
    # The admin API: only from adminIngressFrom. Empty (the default) admits no
    # pod at all; kubectl port-forward still works (it enters the pod's
    # network namespace, which NetworkPolicy doesn't filter).
    - ports:
        - {port: admin, protocol: TCP}
      from: {{- toYaml $np.adminIngressFrom | nindent 8 }}
    {{- end }}
  {{- if $np.restrictEgress }}
  egress:
    # DNS to the cluster resolver only.
    - to:
        - namespaceSelector: {{- toYaml $np.dns.namespaceSelector | nindent 12 }}
          podSelector: {{- toYaml $np.dns.podSelector | nindent 12 }}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    # The IdPs (OIDC discovery, token and JWKS endpoints).
    {{- with $np.idpEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    # The database and anything else.
    {{- with $np.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
