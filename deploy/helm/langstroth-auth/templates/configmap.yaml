{{- if not .Values.config.public_url }}{{ fail "config.public_url is required" }}{{ end }}
{{- if not .Values.signingKey.existingSecret }}{{ fail "signingKey.existingSecret is required (create it from `langstroth-auth keygen --out`)" }}{{ end }}
{{- if gt (int .Values.replicas) 1 }}{{ fail "langstroth-auth runs exactly one replica in 2.0: sign-in flow and device-code state is per process even with the Postgres store" }}{{ end }}
{{- $pg := eq (include "langstroth-auth.storeDriver" .) "postgres" }}
{{- if and (not $pg) (eq .Values.store.driver "postgres") }}{{ fail "store.driver=postgres needs database.mode external, cnpg or bundled" }}{{ end }}
{{- if and (not $pg) (not .Values.persistence.enabled) (not .Values.persistence.allowEphemeral) }}{{ fail "store.driver=file without persistence loses every session on restart: set persistence.enabled=true (or persistence.allowEphemeral=true for CI)" }}{{ end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "langstroth-auth.fullname" . }}
  labels: {{- include "langstroth-auth.labels" . | nindent 4 }}
data:
  config.json: |
{{ include "langstroth-auth.config" . | indent 4 }}
