apiVersion: v1
kind: Service
metadata:
  name: {{ include "langstroth-auth.fullname" . }}
  labels: {{- include "langstroth-auth.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "langstroth-auth.selectorLabels" . | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
{{- if .Values.adminToken.existingSecret }}
---
# The admin API gets its own ClusterIP Service so the public Service and the
# Ingress never route to it. Reach it with kubectl port-forward.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "langstroth-auth.fullname" . }}-admin
  labels: {{- include "langstroth-auth.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "langstroth-auth.selectorLabels" . | nindent 4 }}
  ports:
    - {name: admin, port: {{ .Values.service.adminPort }}, targetPort: admin}
{{- end }}
