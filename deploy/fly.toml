# Fly.io config for a self-hosted Langstroth relay (langstroth-relay). Deploy from this repo root:
#   fly launch --copy-config --no-deploy   # pick app name / region
#   fly deploy
# Fly terminates TLS at its edge and forwards 443 → internal_port (8443), giving
# you an https://<app>.fly.dev URL to point the client at.

app = "langstroth-relay"         # example name; `fly launch` offers to pick a unique name
primary_region = "iad"      # change to one near your users (e.g. lhr, fra, sjc)

[build]
  # Resolved relative to this config's dir (deploy/); the Dockerfile lives at the
  # repo root. Deploy from the repo root: `fly deploy . --config deploy/fly.toml`.
  dockerfile = "../Dockerfile"

[env]
  # In-memory + JSON snapshot on the volume below (single instance). For HA, set
  # DATABASE_URL to a shared Postgres as a secret (`fly secrets set DATABASE_URL=…`)
  # and remove this + the mount — DATABASE_URL takes precedence, and you can then
  # raise min_machines_running.
  LANGSTROTH_RELAY_DATA_DIR = "/data"

# Persistent volume for the snapshot store. Create once before first deploy:
#   fly volumes create hive_data --size 1 --region <primary_region>
# (The volume keeps its pre-rename name: existing deployments of this config
# already have a volume called hive_data, and Fly cannot rename a volume.)
[[mounts]]
  source = "hive_data"
  destination = "/data"

[http_service]
  internal_port = 8443
  force_https = true
  # Exactly one machine, always running: the relay is single-replica by design.
  # Pairing codes, SSE fan-out and rate limits live in the one process, and
  # phone tunnels are long-lived connections that must not be stopped, so
  # never let Fly stop the machine or run a second one.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # Per-machine limits on open connections, not requests: sync streams (SSE)
  # and phone tunnels stay open for a long time, so request-based limits
  # refused new connections at about 500 open streams. These only shed load
  # before the one machine is buried (no autoscaling: single replica). SSE
  # streams are additionally capped in-process (LANGSTROTH_RELAY_MAX_SSE).
  [http_service.concurrency]
    type = "connections"
    soft_limit = 1500
    hard_limit = 2000

  # Health check (current schema: http_service.checks).
  [[http_service.checks]]
    method = "GET"
    path = "/v1/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  # 512MB headroom: the snapshot / in-memory store holds recent E2EE traffic + the
  # social graph in RAM. The public prod app runs on Postgres (DATABASE_URL secret)
  # and sets HIVE_RELAY_REQUIRE_DB=1 (LANGSTROTH_RELAY_REQUIRE_DB also accepted) so it never silently falls back to the
  # ephemeral in-memory store (see buildStore / deploy.yml).
  memory = "512mb"
