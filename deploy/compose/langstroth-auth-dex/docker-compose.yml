# Example only (not run in CI): Dex federating GitHub (or LDAP/SAML) in front
# of langstroth-auth and the relay. Kubeflow shops already run Dex: reuse it and
# just add the langstroth-auth static client (see dex.yaml). Replace example.com,
# then follow docs/langstroth-auth-dex.
#
# Before the first start:
#   mkdir -p secrets && chmod 700 secrets
#   docker run --rm -v "$PWD/secrets:/out" --user "$(id -u)" ghcr.io/langstroth-ai/langstroth-auth:0.4.0 keygen --out /out/signing-key
#   docker run --rm ghcr.io/langstroth-ai/langstroth-auth:0.4.0 gen-token > secrets/dex-client-secret && chmod 600 secrets/dex-client-secret
#   Put the same secret in .env as LANGSTROTH_AUTH_DEX_SECRET, plus the GitHub
#   OAuth app id/secret as GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET.
services:
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    restart: unless-stopped

  dex:
    image: ghcr.io/dexidp/dex:v2.41.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    environment:
      LANGSTROTH_AUTH_DEX_SECRET: ${LANGSTROTH_AUTH_DEX_SECRET:?}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?}
    volumes:
      - ./dex.yaml:/etc/dex/config.yaml:ro
      - dex-data:/var/dex
    restart: unless-stopped

  langstroth-auth:
    image: ghcr.io/langstroth-ai/langstroth-auth:0.4.0
    command: ["serve", "--config", "/etc/langstroth-auth/config.json"]
    volumes:
      - ./langstroth-auth.json:/etc/langstroth-auth/config.json:ro
      - ./secrets:/etc/langstroth-auth/secrets:ro
      - langstroth-auth-state:/var/lib/langstroth-auth
    restart: unless-stopped

  relay:
    image: ghcr.io/langstroth-ai/langstroth-relay:0.4.0
    environment:
      LANGSTROTH_RELAY_TOKEN_PUBKEY: ${LANGSTROTH_RELAY_TOKEN_PUBKEY:?set it from langstroth-auth keygen}
      LANGSTROTH_RELAY_WORKSPACE_SCOPE: strict
      LANGSTROTH_RELAY_TENANTS: acme
      LANGSTROTH_RELAY_DATA_DIR: /data
    volumes:
      - relay-data:/data
    restart: unless-stopped

volumes:
  caddy-data:
  dex-data:
  langstroth-auth-state:
  relay-data:
