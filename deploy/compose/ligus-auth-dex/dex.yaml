issuer: https://dex.example.com
storage:
  type: sqlite3
  config:
    file: /var/dex/dex.db
web:
  http: 0.0.0.0:5556
oauth2:
  skipApprovalScreen: true
staticClients:
  - id: ligus-auth
    name: Ligus
    secretEnv: LIGUS_AUTH_DEX_SECRET
    redirectURIs:
      - https://auth.example.com/t/acme/callback
connectors:
  # GitHub: groups arrive as "<org>:<team>" (and "<org>" with useLoginAsID off).
  - type: github
    id: github
    name: GitHub
    config:
      clientID: $GITHUB_CLIENT_ID
      clientSecret: $GITHUB_CLIENT_SECRET
      redirectURI: https://dex.example.com/callback
      orgs:
        - name: acme
          teams: [platform, ml]
      teamNameField: slug
