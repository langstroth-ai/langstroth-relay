# Deploy to Fly.io on a release. A pushed tag v* runs `ci` (the same tests as
# every push to main) and, when it is green, deploys the OPEN relay binary
# (cmd/langstroth-relay) from that tag to the project's public relay instance
# on Fly (app hive-relay-enterprise; an internal legacy name, see below). Pushes
# to main no longer deploy. It runs the same open binary anyone can self-host
# and must only ever be deployed from this repo.
#
# Requires the FLY_API_TOKEN repo secret (a deploy token):
#   fly tokens create deploy -x 999999h
#   -> langstroth-ai/langstroth-relay -> Settings -> Secrets and variables -> Actions -> FLY_API_TOKEN
# Until that secret exists the deploy step skips cleanly (no failed run).
#
# A manual dispatch redeploys a release tag (pick the tag as the ref); it is
# refused on a branch. `deploy/fly.toml` names a placeholder app, so
# `--app hive-relay-enterprise` targets the real one (the Fly app keeps its
# legacy name, which describes nothing about what it runs: its hostname is
# baked into clients); the app's DATABASE_URL secret takes precedence over the
# volume, so the Postgres store is used.
name: deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency: deploy-relay

permissions:
  contents: read

jobs:
  ci:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    # Only a release tag, pushed or picked for a manual dispatch.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Approval gate (P2-22): configure the `production` environment under
    # Settings -> Environments with required reviewers so a human approves each
    # prod deploy of the public relay. (Creating the environment is a one-time
    # repo-settings step; the job references it here.)
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Deploy exactly the commit the ci job above tested: the tag's commit.
          ref: ${{ github.sha }}
          persist-credentials: false
      # flyctl is installed from a pinned upstream release and checked against
      # its published SHA-256 (P2-22). The flyctl-actions installer would download whatever URL
      # the Fly API returns, unverified, into the step that holds FLY_API_TOKEN.
      # Bump FLYCTL_VERSION and FLYCTL_SHA256 together (flyctl_<ver>_checksums.txt).
      - name: Install flyctl (pinned, checksum-verified)
        env:
          FLYCTL_VERSION: 0.4.122
          FLYCTL_SHA256: 3d6ae2e2e24df47b46132e8920eebb7aec4ed0930dae2074369e59db89493cf2
        run: |
          set -euo pipefail
          tarball="flyctl_${FLYCTL_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/superfly/flyctl/releases/download/v${FLYCTL_VERSION}/${tarball}"
          echo "${FLYCTL_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/flyctl"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/flyctl" flyctl
          echo "$RUNNER_TEMP/flyctl" >> "$GITHUB_PATH"
      - name: Deploy (open relay -> hive-relay-enterprise)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "FLY_API_TOKEN not set - skipping deploy (add the secret to enable auto-deploy)."
            exit 0
          fi
          # HIVE_RELAY_REQUIRE_DB=1 makes the prod app refuse to boot on the
          # ephemeral in-memory store if DATABASE_URL is ever missing (P2-16); set
          # here (not in the shared deploy/fly.toml) so self-host copies of the
          # config keep the snapshot-store fallback.
          flyctl deploy --remote-only --app hive-relay-enterprise --config deploy/fly.toml \
            --env HIVE_RELAY_REQUIRE_DB=1
