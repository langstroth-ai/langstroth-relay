name: kind-e2e

# Builds the non-root relay image, installs the Helm chart on kind in both
# topologies (split with Postgres, single with the memory store) under Pod
# Security "restricted", and runs the chart's tests.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: kind-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1
      - run: helm lint --strict deploy/helm/ligus-relay
      - name: render every documented combination
        run: |
          set -e
          refuse() { if helm template "$@" >/dev/null 2>&1; then echo "chart rendered but must refuse: $*"; exit 1; fi; }
          c=deploy/helm/ligus-relay
          helm template t $c >/dev/null
          helm template t $c -f $c/ci/split-postgres-values.yaml >/dev/null
          helm template t $c -f $c/ci/single-memory-values.yaml >/dev/null
          helm template t $c --set externalDatabase.url=postgres://u:p@db:5432/r --set ingress.enabled=true --set httpRoute.enabled=true --set metrics.serviceMonitor.enabled=true >/dev/null
          # Must refuse: split topology without a database; relay-sync HA
          # (unsupported in 2.0); the dev Postgres without its Secret.
          refuse t $c --set topology=split
          refuse t $c --set externalDatabase.url=postgres://u:p@db:5432/r --set sync.replicas=2
          refuse t $c --set externalDatabase.url=postgres://u:p@db:5432/r --set sync.autoscaling.enabled=true
          refuse t $c --set externalDatabase.url=postgres://u:p@db:5432/r --set sync.pdb.enabled=true
          refuse t $c --set postgres.enabled=true
      - name: ligus-auth chart
        run: |
          set -e
          refuse() { if helm template "$@" >/dev/null 2>&1; then echo "chart rendered but must refuse: $*"; exit 1; fi; }
          a=deploy/helm/ligus-auth
          helm lint --strict $a -f $a/ci/dex-values.yaml
          helm template t $a -f $a/ci/dex-values.yaml >/dev/null
          helm template t $a -f $a/ci/dex-values.yaml --set store.driver=postgres --set store.databaseUrl.existingSecret=db >/dev/null
          # Must refuse: no public_url / no signing key / more than one replica
          # with either store (unsupported in 2.0) / file store without a volume.
          refuse t $a
          refuse t $a -f $a/ci/dex-values.yaml --set signingKey.existingSecret=
          refuse t $a -f $a/ci/dex-values.yaml --set replicas=2
          refuse t $a -f $a/ci/dex-values.yaml --set store.driver=postgres --set store.databaseUrl.existingSecret=db --set replicas=2
          refuse t $a -f $a/ci/dex-values.yaml --set persistence.enabled=false

  e2e:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        values: [split-postgres-values.yaml, single-memory-values.yaml]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/container/Dockerfile
          tags: ligus-relay:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: image runs as non-root
        run: test "$(docker inspect -f '{{.Config.User}}' ligus-relay:ci)" = "65532:65532"
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: relay-e2e
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1
      - name: load image
        run: kind load docker-image ligus-relay:ci --name relay-e2e
      - name: install
        run: |
          kubectl create namespace ligus-relay
          kubectl label namespace ligus-relay pod-security.kubernetes.io/enforce=restricted
          # The in-chart dev Postgres reads its password and DSN from a
          # Secret the operator creates (the chart generates none).
          PW=$(openssl rand -hex 24)
          kubectl -n ligus-relay create secret generic relay-dev-postgres \
            --from-literal=password="$PW" \
            --from-literal=DATABASE_URL="postgres://relay:$PW@ligus-relay-postgres:5432/relay?sslmode=disable"
          # Settings delivered as files (LIGUS_RELAY_SECRETS_DIR).
          kubectl -n ligus-relay create secret generic relay-env \
            --from-literal=LIGUS_RELAY_METRICS_TOKEN="$(openssl rand -hex 16)"
          helm install ligus-relay deploy/helm/ligus-relay -n ligus-relay \
            --set config.existingSecret=relay-env \
            -f deploy/helm/ligus-relay/ci/${{ matrix.values }} --wait --timeout 5m
      - name: helm test
        run: helm test ligus-relay -n ligus-relay --logs
      - name: metrics and health through the Service
        run: |
          svc=$(kubectl -n ligus-relay get svc -l app.kubernetes.io/component!=postgres -o jsonpath='{.items[0].metadata.name}')
          kubectl -n ligus-relay port-forward svc/$svc 8443:8443 &
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8443/v1/health && break; sleep 1; done
          # The metrics token came from the mounted secrets directory: without
          # it /metrics is refused, with it it answers.
          tok=$(kubectl -n ligus-relay get secret relay-env -o jsonpath='{.data.LIGUS_RELAY_METRICS_TOKEN}' | base64 -d)
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8443/metrics)" != 200
          curl -fsS -H "Authorization: Bearer $tok" http://127.0.0.1:8443/metrics | grep -q relay_requests_total
          # No secret reaches the pod environment.
          pod=$(kubectl -n ligus-relay get pod -l app.kubernetes.io/name=ligus-relay,app.kubernetes.io/component!=postgres -o jsonpath='{.items[0].metadata.name}')
          if kubectl -n ligus-relay get pod "$pod" -o yaml | grep -q secretKeyRef; then echo "::error::secret in env"; exit 1; fi
      - name: diagnostics
        if: failure()
        run: |
          kubectl -n ligus-relay get all,pvc,networkpolicy
          kubectl -n ligus-relay describe pods
          kubectl -n ligus-relay logs -l app.kubernetes.io/name=ligus-relay --all-containers --tail=200
